<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Convite Safari</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Patrick+Hand&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#2f3f22;
    font-family:Arial, sans-serif;
    display:flex;
    justify-content:center;
    padding:10px;
}

.convite{
    width:420px;
    background:#f5efdf;
    overflow:hidden;
    border-radius:8px;
    box-shadow:0 10px 30px rgba(0,0,0,.3);
}

/* TOPO */

.topo{
    height:260px;
    position:relative;
    background:
    radial-gradient(circle at 20% 20%, #567d3f 0%, transparent 25%),
    radial-gradient(circle at 80% 30%, #4c7038 0%, transparent 25%),
    radial-gradient(circle at 40% 80%, #5f8847 0%, transparent 25%),
    linear-gradient(#24411e,#506f36);
}

/* folhas decorativas */

.topo::before,
.topo::after{
    content:"";
    position:absolute;
    width:180px;
    height:180px;
    background:rgba(0,0,0,.12);
    border-radius:50% 0;
}

.topo::before{
    left:-50px;
    bottom:-40px;
    transform:rotate(25deg);
}

.topo::after{
    right:-50px;
    top:-30px;
    transform:rotate(-25deg);
}

/* placa */

.placa{
    position:absolute;
    left:50%;
    bottom:-80px;
    transform:translateX(-50%);
    width:100%;
}

.placa-img{
    width:100%;
    display:block;
}

.nome{
    position:absolute;
    top:42%;
    left:50%;
    transform:translate(-50%, -50%);

    color:#f4d166;
    font-family:'Cinzel', serif;
    font-size:52px;
    white-space:nowrap;
}

.idade{
    position:absolute;
    top:76%;
    left:50%;
    transform:translate(-50%, -50%);

    color:#f4d166;
    font-family:'Cinzel', serif;
    font-size:28px;
    white-space:nowrap;
}

/* CONTEÚDO */

.conteudo{
    padding:80px 30px 40px;
    text-align:center;
    background:
    radial-gradient(circle at 10% 10%, rgba(165,132,78,.08), transparent 15%),
    radial-gradient(circle at 80% 70%, rgba(165,132,78,.08), transparent 15%),
    #f5efdf;
}

.texto{
    color:#5b2d2d;
    font-size:17px;
    line-height:1.6;
}

.data{
    margin-top:35px;
}

.dia{
    font-size:90px;
    color:#b52f2f;
    font-family:'Cinzel', serif;
    line-height:1;
}

.mes{
    margin-top:-20px;
    font-size:55px;
    color:#d8a328;
    font-family:'Patrick Hand', cursive;
}

.info{
    display:flex;
    justify-content:center;
    gap:20px;
    margin-top:35px;
}

.item{
    width:95px;
}

.icone{
    width:90px;
    height:90px;
    border-radius:50%;
    background:
    linear-gradient(
        135deg,
        #f7e08b,
        #d4a220
    );
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:38px;
    color:#8f2323;
    margin:auto;
}

.item p{
    margin-top:10px;
    color:#8f2323;
    font-size:13px;
    font-weight:bold;
}

/* RODAPÉ */

.rodape{
    height:120px;
    position:relative;
    background:
    linear-gradient(
        #95c95d 0%,
        #7ab04c 100%
    );
}

.grama{
    position:absolute;
    bottom:0;
    width:100%;
    height:40px;
    background:
    repeating-linear-gradient(
        90deg,
        #5f8f3a 0 8px,
        #76ab47 8px 16px
    );
}

</style>
</head>
<body>

<div class="convite">

    <div class="topo">
        <video
            id="myVideo"
            class="video-topo"
            controls
            loop
            playsinline
            disablepictureinpicture
            controlslist="nodownload nofullscreen noremoteplayback">
            <source src="topo.mp4" type="video/mp4">
        </video>
        <button class="play-video" id="playBtn">&nbsp;▶</button>

        <div class="placa">
            <img src="title.png" alt="" class="placa-img">
            <div class="nome">LEVI</div>
            <div class="idade">1 ANO</div>
        </div>

    </div>

    <div class="conteudo">

        <div class="texto">
            A SELVA ESTÁ EM FESTA!<br>
            VENHA COMEMORAR O MEU ANIVERSÁRIO
        </div>

        <div class="data">
            <div class="dia">12</div>
            <div class="mes">Julho</div>
        </div>

        <div class="texto" style="margin-top:10px">
            SÁBADO • ÀS 19:00
        </div>

        <div class="info">

            <div class="item">
                <div class="icone">📍</div>
                <p>LOCAL</p>
            </div>

            <div class="item">
                <div class="icone">☎</div>
                <p>CONFIRMAR</p>
            </div>

            <div class="item">
                <div class="icone">🎁</div>
                <p>PRESENTES</p>
            </div>

        </div>

    </div>

    <div class="rodape">
        <div class="grama"></div>
    </div>

</div>

</body>
</html>
