<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Convite</title>

<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}
@font-face {
    font-family: 'BravaSlab';
    src: url('Brava-Slab-Bold.ttf') format('truetype');
    font-weight: bold;
    font-style: normal;
}
@font-face {
    font-family: 'Horny_Village_SEGUNDA';
    src: url('horny_village_s.ttf') format('truetype');
    /* font-weight: bold; */
    /* font-style: normal; */
}

body{
    background:#f1faff;
    font-family:'Montserrat',sans-serif;
    display:flex;
    justify-content:center;
    padding:10px;
}
.convite {
    width: 470px;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 15px 40px rgba(0,0,0,.15);
    position: relative;
    background: linear-gradient(
        271deg,
        rgba(245,251,254,.85),
        rgba(255,255,255,.75),
        rgba(245,251,254,.85)
    );
}
.convite::before {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 300px; /* área ocupada pelo fundo */
    background: 
        linear-gradient(
            rgba(255,255,255,.65),
            rgba(255,255,255,.65)
        ),
        url("fundo.png") center bottom / auto no-repeat;
    filter: blur(10px);
    z-index: 0;
}
.convite > * {
    position: relative;
    z-index: 1;
}

/* TOPO */

.topo{
    height:250px;
    position:relative;
    overflow:hidden;
    background:#000;
}

.video-topo{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    object-fit:cover;

    /* impede interação */
}
.decoracao{
    position:absolute;
    pointer-events:none;
    z-index:1;
    animation:balancar 4s ease-in-out infinite;
}
.d1{ animation-duration:2.5s; }
@keyframes balancar {
    0%{
        transform:translateX(0px) rotate(0deg);
    }
    25%{
        transform:translateX(4px) rotate(1deg);
    }
    50%{
        transform:translateX(0px) rotate(0deg);
    }
    75%{
        transform:translateX(-4px) rotate(-1deg);
    }
    100%{
        transform:translateX(0px) rotate(0deg);
    }
}
/* NUVENS */

.nuvens{
    position:relative;
    padding:25px 25px 165px 25px;
}
/* TEXTOS */

.nome-container{
    text-align:center;
    padding-left:10px;
    padding-right:10px;
    margin-top: -40px;
}
.linha1{
    font-family:'Georgia', serif;
    font-size: 40.5pt;
    font-weight:bold;
    color:#b42215;
    line-height:1;
}
.linha2{
    font-family:'Great Vibes', cursive;
    font-size:48px;
    color:#dfa82f;
    margin-top:-5px;
    position:relative;
    top:-20px;      /* sobe um pouco */
    transform:rotate(-5deg);
    z-index:2;
}
.nome-container,
.linha1,
.linha2{
    -webkit-text-size-adjust:100%;
    text-size-adjust:100%;
}
.letra{
    display:inline-block;
    opacity:0;
    transform:translateY(20px);
    animation:aparecer .5s forwards;
}
@keyframes aparecer{
    to{
        opacity:1;
        transform:translateY(0);
    }
}
.subtitulo{
    z-index: 1000;
    text-align:center;
    font-weight: bold;
    color:#b42215;
    font-size:18px;
    margin-top:15px;
    margin-bottom:13px;
}

.subtitulo2{
    font-family: 'montserrat', serif;
    text-align:center;
    /* color:#666; */
    color: #b42215;
    font-weight: bold;
    font-size:16px;
    margin-bottom:15px;
}



/* DATA */
.data{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:25px;
}
.data-box{
    font-family:'Georgia', serif;
    flex:1;
    text-align:center;
    color:#dfa82f;
    font-size: 20px;
    border-top: 1px solid #aaa;border-bottom: 1px solid #aaa;padding-top: 5px;padding-bottom: 5px;
}
.dia{
    text-align:center;
    min-width:120px;
}
.dia .mes{
    font-family:'Georgia', serif;
    color:#dfa82f;
    font-weight:600;
}
.dia .numero{
    font-size:72px;
    line-height:1;
    font-weight:700;
    color:#b42215;
}
.dia .ano{
    color:#dfa82f;
}

/* ÍCONES */

.icones{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    /* gap:15px; */
    padding-left: 120px;
    z-index: 1000;
    margin-top: 40px;
}

.icone{
    text-align:center;
    z-index: 1000;
    cursor:pointer;
    animation:flutuar 4s ease-in-out infinite;
}
.icone:nth-child(1){
    animation-duration:4s;
}

.icone:nth-child(2){
    animation-duration:5s;
    animation-delay:-1s;
}

.icone:nth-child(3){
    animation-duration:4.5s;
    animation-delay:-2s;
}
.icone:hover{
    cursor: pointer;
}

.circulo{
    width:58px;
    height:58px;
    margin:auto;
    border-radius:50%;
    background:#f6c245;
    border: 1px solid #b42215;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:24px;
    transition:.3s;
    box-shadow:
        0 0 10px rgba(246,194,69,.5),
        0 0 20px rgba(246,194,69,.3),
        0 0 35px rgba(246,194,69,.2);
    animation:brilho 3s ease-in-out infinite;
}
@keyframes brilho {
    0%{
        box-shadow:
            0 0 10px rgba(246,194,69,.4),
            0 0 20px rgba(246,194,69,.2);
    }
    50%{
        box-shadow:
            0 0 20px rgba(246,194,69,.8),
            0 0 40px rgba(246,194,69,.5),
            0 0 60px rgba(246,194,69,.3);
    }
    100%{
        box-shadow:
            0 0 10px rgba(246,194,69,.4),
            0 0 20px rgba(246,194,69,.2);
    }
}
.icone p{
    margin-top:8px;
    font-size:11px;
    color:#666;
}

/* CSS DO MODAL DE PRESENTES */
/* fundo escuro */

.overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.5);

    opacity:0;
    visibility:hidden;

    transition:.3s;
    z-index:999;
}

/* card */

.card-presente{
    position:fixed;
    left:0;
    bottom:0;

    width:100%;
    max-height:90vh;

    background:#fff;
    border-radius:25px 25px 0 0;

    transform:translateY(100%);
    transition:.4s ease;

    z-index:1000;

    overflow:auto;
}

/* aberto */

.overlay.ativo{
    opacity:1;
    visibility:visible;
}

.card-presente.ativo{
    transform:translateY(0);
}
.conteudo-presente{
    background: linear-gradient(271deg, #f5fbfe, #ffffff, #f5fbfe);
    min-height:500px;
    padding:60px 30px 40px;
    border-radius:20px;
    position:relative;
    overflow:hidden;
    padding:30px;
}
.fechar{
    position:absolute;
    top:15px;
    right:20px;

    font-size:28px;
    cursor:pointer;
}

h2{
    /* font-family: 'Horny_Village_SEGUNDA'; */
    font-family: 'Montserrat';
    font-size: 14pt;
    position:relative;
    z-index:100;
    text-align:center;
    margin-bottom:45px;
    color:#b42215;
}

.gift-list{
    list-style:none;
    display:flex;
    flex-direction:column;
    gap:18px;
    position:relative;
    z-index:2;
}

.item{
    height:58px;
    border-radius:30px;
    display:flex;
    align-items:center;
    padding-left:75px;
    color:white;
    font-weight:bold;
    position:relative;
    margin-bottom: 30px;
}

.icon-modal{
    position:absolute;
    left:0;
    width:58px;
    height:58px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:24px;
}

.color1{
    background:#b42215;
}

/* Imagens */

.character{
    position:absolute;
    z-index:3;
}
.play-video{
    position:absolute;
    top:45%;
    left:50%;
    transform:translate(-50%, -50%);

    width:70px;
    height:70px;

    border:none;
    border-radius:50%;

    background:rgba(0,0,0,0.35);
    backdrop-filter:blur(3px);

    color:white;
    font-size:32px;

    cursor:pointer;
    z-index:10;

    transition:.3s;
}

.play-video:hover{
    transform:translate(-50%, -50%) scale(1.1);
}
@keyframes flutuar {
    0%{
        transform:translateY(0px) scale(1);
    }
    25%{
        transform:translateY(-4px) scale(1.03);
    }
    50%{
        transform:translateY(0px) scale(1.06);
    }
    75%{
        transform:translateY(4px) scale(1.03);
    }
    100%{
        transform:translateY(0px) scale(1);
    }
}

/* Texto em arco */
.frases-arco {
    width: 100%;
    max-width: 600px;
    margin: 0 auto;
}

.frase {
    width: 100%;
    display: block;
    overflow: visible;
}
.frase1{
    margin-top: -10px;
}
.frase2{
    margin-top: -60px;
}
.frase text {
    font-family: "Georgia", sans-serif;
    font-size: 30px;
    font-weight: bold;
    fill: #b42215;
}
</style>
</head>
<body>

<div class="convite">

    <div class="topo">
        <video
            id="myVideo"
            class="video-topo"
            autoplay
            muted
            loop
            playsinline
            disablepictureinpicture
            controlslist="nodownload nofullscreen noremoteplayback">
            <source src="cantando.mp4" type="video/mp4">
        </video>
        <button class="play-video" id="playBtn">&nbsp;▶</button>
    </div>
    <div class="nuvens">
        <img src="passaro.png" class="decoracao" style="width: 75px;left: 338px;top: -35px;">
        <img src="passaro2.png" class="decoracao" style="width: 75px;left: 0;top: 200px;">
        <img src="macieira.png" style="position: absolute;left: 299px;top: 425px;width: 325px;">
        <img src="macieira.png" style="position: absolute;left: -184px;top: 411px;width: 325px;z-index: -1;">
        <img src="brancadeneve.png" style="width: 378px;position: absolute;pointer-events: none;z-index: 1;top: 432px;left: -127px;">
        <img src="grama.png" style="position: absolute;top: 575px;left: -10px;filter: blur(2px);">
        <img src="anoes.png" style="position: absolute;top: 635px;width: 400px;left: 80px;">
        <div class="frases-arco">
            <!-- Primeira frase -->
            <svg viewBox="0 0 600 130" class="frase frase1">
                <defs>
                    <path id="arco1" d="M 40,90 Q 300,10 560,90" />
                </defs>

                <text>
                    <textPath href="#arco1"
                            startOffset="50%"
                            text-anchor="middle">
                        Espelho Espelho meu...
                    </textPath>
                </text>
            </svg>

            <!-- Segunda frase -->
            <svg viewBox="0 0 600 150" class="frase frase2">
                <defs>
                    <path id="arco2" d="M 20,105 Q 300,25 580,105" />
                </defs>

                <text>
                    <textPath href="#arco2"
                            startOffset="50%"
                            text-anchor="middle">
                        Existe princesa mais bela do que eu?
                    </textPath>
                </text>
            </svg>
        </div>
        <img src="maca.png" style="position: relative;width: 75px;left: 40%;top: -40px;">
        <div class="nome-container">
            <div class="linha1" id="nome">Maria</div>
            <div class="linha2" id="subtitulo">faz 3 aninhos</div>
        </div>
        <p class="subtitulo">
            Venha comemorar comigo esse<br> momento tão especial!
        </p>
        <div class="data">
            <div class="data-box">
                SÁBADO
            </div>
            <div class="dia">
                <div class="mes">AGOSTO</div>
                <div class="numero" style="font-family:'Great Vibes', cursive;">03</div>
                <div class="ano">2026</div>
            </div>
            <div class="data-box">
                às <strong>15:00</strong>
            </div>
        </div>
        <p class="subtitulo2">
            LOCAL: R. João, 123
        </p>
        <div class="icones">
            <div class="icone" onclick="window.open('https://web.whatsapp.com/','_self')">    
                <div class="circulo"><img src="ic-confirm.png" style="width: 25px"></div>
                <p>CONFIRMAR</p>
            </div>
            <div class="icone" onclick="window.open('https://www.google.com/maps/place/S%C3%A3o+Paulo,+SP/@-23.6820621,-46.9256378,115791m/data=!3m2!1e3!4b1!4m6!3m5!1s0x94ce448183a461d1:0x9ba94b08ff335bae!8m2!3d-23.5557714!4d-46.6395571!16zL20vMDIycGZt!5m1!1e1?entry=ttu&g_ep=EgoyMDI2MDkyOC4wIKXMDSoASAFQAw%3D%3D','_blank');">
                <div class="circulo"><img src="ic-gps.png" style="width: 25px"></div>
                <p>LOCAL</p>
            </div>
            <div class="icone" onclick="abrirPresente()">
                <div class="circulo"><img src="ic-present.png" style="width: 40px"></div>
                <p>SUGESTÕES</p>
            </div>
        </div>
    </div>
</div>
<div class="overlay" id="overlay" onclick="fecharPresente()"></div>

<div class="card-presente" id="cardPresente">
    <div class="fechar" onclick="fecharPresente()">✕</div>
        <div class="conteudo-presente">
        <!-- Imagens sobrepostas -->
        <h2>Sua presença já é um presente. Mas, se deseja me presentear:</h2>
        <ul class="gift-list">
            <li class="item color1">
                <div class="icon-modal">
                    <img src="ic-cabide.png" style="width: 50px">
                </div>
                <span>Visto tamanho 5</span>
            </li>
            <li class="item color1">
                <div class="icon-modal">
                    <img src="ic-sapato.png" style="width: 50px;">
                </div>
                <span>Calço 23/24</span>
            </li>
            <li class="item color1">
                <div class="icon-modal">
                    <img src="ic-brinquedo.png" style="width: 45px">
                </div>
                <span>Adoro Brinquedos</span>
            </li>
        </ul>
    </div>
</div>
</body>
<script>
function animarTexto(id, delayInicial = 0){
    const elemento = document.getElementById(id);
    const texto = elemento.textContent;

    elemento.innerHTML = '';

    [...texto].forEach((letra, index) => {
        const span = document.createElement('span');
        span.classList.add('letra');
        span.textContent = letra === ' ' ? '\u00A0' : letra;
        span.style.animationDelay =
            `${delayInicial + (index * 0.08)}s`;

        elemento.appendChild(span);
    });
}

animarTexto('nome');
animarTexto('subtitulo', 0.6);


function abrirPresente(){
    document.getElementById('overlay').classList.add('ativo');
    document.getElementById('cardPresente').classList.add('ativo');
}
function fecharPresente(){
    document.getElementById('overlay').classList.remove('ativo');
    document.getElementById('cardPresente').classList.remove('ativo');
}

const video = document.getElementById('myVideo');
const playBtn = document.getElementById('playBtn');

playBtn.addEventListener('click', () => {
    video.play();
});

video.addEventListener('play', () => {
    playBtn.style.display = 'none';
});

video.addEventListener('pause', () => {
    playBtn.style.display = 'block';
});

video.addEventListener('ended', () => {
    playBtn.style.display = 'block';
});
</script>
</html>
