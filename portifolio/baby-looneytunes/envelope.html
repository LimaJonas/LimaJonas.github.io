<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Envelope</title>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
@page{
    size: A4;
    margin: 0;
}
html, body{
    margin:0;
    padding:0;
}
body{
    background:#fff;
    display:block;
    padding:0;
}
@font-face {
    font-family: 'BravaSlab';
    src: url('Brava-Slab-Bold.ttf') format('truetype');
    font-weight: bold;
    font-style: normal;
}
@font-face {
    font-family: 'Matcha Mint';
    src: url('MatchaMint.ttf') format('truetype');
    font-weight: bold;
    font-style: normal;
}
body{
    background:#fff;
    display:block;
    padding:0;
    font-family:'Montserrat',sans-serif;
}
.convite{
    width:auto;
    background:none;
    border-radius:0;
    box-shadow:none;
}
.decoracao{
    width: 25px;
    position:absolute;
    pointer-events:none;
    z-index:1;
}
.faixa-nuvens{
    position:absolute;
    top: -10px;
    left: -30px;
    width:100%;
    display:flex;
    justify-content:space-around;
    align-items:flex-end;
    /* z-index:10; */
}
.faixa-nuvens img{
    width:120px;
    height:auto;
}

.faixa-nuvens2{
    position:absolute;
    top: -30px;
    left: -80px;
    width:100%;
    display:flex;
    justify-content:space-around;
    align-items:flex-end;
}
.faixa-nuvens2 img{
    width:120px;
    height:auto;
}
.faixa-nuvens3{
    position:absolute;
    top: -30px;
    left: -100px;
    width:100%;
    display:flex;
    justify-content:space-around;
    align-items:flex-end;
}
.faixa-nuvens3 img{
    width:120px;
    height:auto;
}
/* NUVENS */

.nuvens{
    position:relative;

    /* A4 retrato */
    width:210mm;
    height:297mm;

    overflow:hidden;

    background-image:
        url('galera.png'),
        url('background.jpg');

    background-repeat:
        no-repeat,
        no-repeat;

    background-position:
        center bottom,
        center center;

    background-size:
        100% auto,
        cover;
}

.faixa-nuvens,
.faixa-nuvens2,
.faixa-nuvens3{
    display:flex;
    gap:30px;
    width:max-content;
    margin-top: 30px;
}
/* LOGO */
.logo{
    width:370px;
    margin:0px auto 0px;
    border-radius:50px;
    overflow:hidden;
    position:relative;
    z-index:5;
    animation:balancar 15s ease-in-out infinite;
}
.logo img{
    width:100%;
    height:100%;
    object-fit:cover;
}
/* TEXTOS */
.subtitulo{
    z-index: 1000;
    text-align:center;
    color:#666;
    font-size:25pt;
    margin-bottom:13px;
    margin-top: 0;
    font-weight: bold;
}
/* DATA */
.data{
    display:flex;
    justify-content:center;
    align-items:center;
    margin-bottom:25px;
}
.data:hover{
    cursor: pointer;
}
.dia{
    text-align:center;
    min-width:120px;
}
.nome-container{
    text-align:center;
    padding-left:10px;
    padding-right:10px;
    padding-top: 45px;
}
.linha0{
    font-family:'BravaSlab', serif;
    font-size: 30pt;
    font-weight:bold;
    color:#5dc2f8;
    line-height:1;
}
.linha1{
    font-family:'Matcha Mint';
    font-size: 95pt;
    font-weight:bold;
    color:#5dc2f8;
    line-height:1;
}

.linha2{
    font-family:'Great Vibes', cursive;
    font-size:80pt;
    font-weight: bold;
    color:#b7dd46;
    margin-top:-8px;
    position:relative;
    top:-20px;      /* sobe um pouco */
    z-index:2;
}
</style>
</head>
<body>
<div class="convite">
    <div class="nuvens">
        <div class="faixa-nuvens">
            <img src="nuvem.png">
            <img src="nuvem.png">
            <img src="nuvem.png">
            <img src="nuvem.png">
            <img src="nuvem.png">
        </div>
        <div class="faixa-nuvens2">
            <img src="nuvem2.png">
            <img src="nuvem2.png">
            <img src="nuvem2.png">
            <img src="nuvem2.png">
            <img src="nuvem2.png">
        </div>
        <div class="faixa-nuvens3">
            <img src="nuvem.png">
            <img src="nuvem.png">
            <img src="nuvem.png">
            <img src="nuvem.png">
            <img src="nuvem.png">
        </div>
        <img src="dot.png" class="decoracao" style="left: 4.76%;top: 30px;">
        <img src="dot.png" class="decoracao" style="left: 84%;top: 40px;">
        <img src="dot.png" class="decoracao" style="left:96.43%;top:280px;">
        <img src="dot2.png" class="decoracao" style="left:1.19%;top:150px;">
        <img src="dot2.png" class="decoracao" style="width:28px;left:92.86%;top:100px;">
        <img src="dot2.png" class="decoracao" style="width:20px;left:88.10%;top:350px;">
        <img src="dot2.png" class="decoracao" style="width:30px;left:-3.57%;top:530px;">
        <img src="dot3.png" class="decoracao" style="left:-4.76%;top:60px;">
        <img src="dot3.png" class="decoracao" style="width:20px;left:95.24%;top:400px;">
        <img src="dot4.png" class="decoracao" style="left:-2.38%;top:430px;">
        <img src="dot4.png" class="decoracao" style="left:76.19%;top:80px;">
        <img src="dot4.png" class="decoracao" style="left:85.71%;top:500px;">
        <img src="estrela.png" class="decoracao" style="width:45px;left:9.52%;top:80px;">
        <img src="estrela.png" class="decoracao" style="width:25px;left:7.14%;top:400px;">
        <img src="estrela2.png" class="decoracao" style="width:40px;left:78.57%;top:220px;">
        <img src="clound.png" class="decoracao" style="width:90px;left:-3.57%;top:-22px;">
        <img src="clound.png" class="decoracao" style="width:80px;left:-10.71%;top:250px">
        <img src="clound.png" class="decoracao" style="width:95px;left:83.33%;top:150px;">
        <div class="logo">
            <img src="logo3d.png" alt="Logo">
        </div>
        <div class="nome-container">
            <div class="linha0" id="nome">Você recebeu um</div>
            <div class="linha1" id="nome">Convite</div>
            <div class="linha2" id="subtitulo">Especial</div>
        </div>
        <a href="https://limajonas.github.io/convite/">
            <div class="data">
                <div class="dia">
                    <img src="pdf/envelope.png" style="width: 370px">
                </div>
            </div>
        </a>
    </div>
</div>
</body>
</html>
