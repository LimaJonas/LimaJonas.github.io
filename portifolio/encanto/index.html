<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Convite Encanto</title>
<style>
@font-face {
    font-family: 'Dancing Script';
    src: url('DancingScript-VariableFont_wght.ttf') format('truetype');
    font-style: normal;
}
@font-face {
    font-family: 'Madrigal';
    src: url('Madrigal.ttf') format('truetype');
    font-style: normal;
}
@font-face {
    font-family: 'Quicksand';
    src: url('Quicksand-VariableFont_wght.ttf') format('truetype');
    font-style: normal;
}

* { box-sizing: border-box; }

:root {
    --card-width: 430px;
    --card-height: 760px;
    --page-background: linear-gradient(130deg, #402662, #c93d90);;
    --text-color: #fff;
}

html, body {
    margin: 0;
    min-height: 100%;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 25px 14px;
    background: var(--page-background);
    font-family: Arial, Helvetica, sans-serif;
}

.invite {
    position: relative;
    width: min(100%, var(--card-width));
    height: var(--card-height);
    overflow: hidden;
    border-radius: 20px;

    /* Troque background.jpg pela sua imagem */
    background-image: url("wallpaper.jpg");
    background-size: cover;
    background-position: center;

    box-shadow: 0 12px 35px rgba(0, 0, 0, .15);
}

/* Opcional: coloque rgba(255,255,255,.10) aqui se precisar clarear
   a imagem para melhorar a leitura dos textos. */
.invite::after {
    content: "";
    position: absolute;
    inset: 0;
    background: rgba(255, 255, 255, 0);
    pointer-events: none;
}

.content {
    margin-top: 295px;
    position: relative;
    z-index: 2;
    height: 100%;
    display: flex;
    flex-direction: column;
    padding: 55px 30px 35px;
    text-align: center;
    color: var(--text-color);
}

.title {
    font-family: 'Madrigal', cursive;
    margin: 0;
    font-size: 45px;
    line-height: 1.05;
    font-weight: 700;
}

.subtitle {
    font-family: 'Dancing Script';
    margin: 0px 0 0;
    font-size: 26px;
    line-height: 1.3;
}

.message {
    font-family: "Quicksand", sans-serif;
    max-width: 350px;
    margin: 15px auto 0;
    font-size: 18px;
    line-height: 1.45;
}

.details {
    display: grid;
    grid-template-columns: 1fr 1fr;
    max-width: 340px;
    width: 100%;
    margin: 15px auto 0;
}

.detail {
    font-family: "Quicksand", sans-serif;
    padding: 5px 15px;
    display: flex;
    flex-direction: column;
    align-items: center;
}

.detail + .detail {
    border-left: 1px solid rgba(0, 0, 0, .35);
}

.number {
    font-size: 38px;
    font-weight: 700;
    line-height: 1;
}

.label {
    margin-top: 7px;
    font-size: 17px;
}


.location {
    font-family: "Quicksand", sans-serif;
    margin: 0 auto 20px;
    max-width: 330px;
    font-size: 16px;
    line-height: 1.4;
}

.actions {
    display: flex;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
}

.action {
    min-width: 95px;
    padding: 11px 16px;
    border: 1px solid rgba(0, 0, 0, .35);
    border-radius: 50px;
    color: var(--text-color);
    background: rgba(255, 255, 255, .35);
    text-decoration: none;
    font-size: 14px;
    font-weight: 600;
    backdrop-filter: blur(3px);
}
.sub-textos{
    font-family: "Quicksand", sans-serif;
    font-size: 8pt;
}

@media (max-width: 450px) {
    body { padding: 0; }

    .invite {
        width: 100%;
        min-height: 100vh;
        height: auto;
        border-radius: 0;
    }

    .content {
        min-height: 100vh;
        padding: 55px 22px 30px;
    }

    .title { font-size: 43px; }
    .subtitle { font-size: 19px; }
    .message { font-size: 17px; }
}
</style>
</head>

<body>

<main class="invite">
    <div class="content">
        <h1 class="title">Cecília</h1>
        <div class="subtitle">
            faz 1 aninho
        </div>

        <p class="message">
            Será um prazer comemorar esse
            momento especial com você!
        </p>

        <section class="details">
            <div class="detail">
                <div class="number">31/07</div>
                <div class="label">Sexta-feira</div>
            </div>

            <div class="detail">
                <div class="number">13:00</div>
                <div class="label">Horas</div>
            </div>
        </section>

        <div class="bottom">

            <p class="location">
                Rua Exemplo, 123<br>
                Cidade - UF
            </p>

            <nav class="actions">
                <a class="action" href="#"><img src="ic-gps.png" width="40px"><br><span class="sub-textos">Localização</span></a>
                <a class="action" href="#"><img src="ic-confirm.png" width="40px"><br><span class="sub-textos">Confirmar</span></a>
            </nav>

        </div>
    </div>
</main>

</body>
</html>
