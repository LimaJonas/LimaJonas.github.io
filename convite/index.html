<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Convite Infantil</title>

<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}
@font-face {
    font-family: 'BravaSlab';
    src: url('Brava-Slab-Bold.ttf') format('truetype');
    font-weight: bold;
    font-style: normal;
}
body{
    background:#dff4ff;
    font-family:'Montserrat',sans-serif;
    display:flex;
    justify-content:center;
    padding:10px;
}

.convite{
    width:420px;
    background:#fff;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 15px 40px rgba(0,0,0,.15);
}

/* TOPO */

.topo{
    height:200px;
    position:relative;
    overflow:hidden;
    background:#000;
}

.video-topo{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    object-fit:cover;

    /* impede interação */
    pointer-events:none;
}
.decoracao{
    width: 25px;
    position:absolute;
    pointer-events:none;
    z-index:1;
    animation:balancar 4s ease-in-out infinite;
}
.estrela{
    animation:girar-estrela 4s ease-in-out infinite;
    transform-origin:center center;
}
.d1{ animation-duration:2.5s; }
.d2{ animation-duration:4.8s; }
.d3{ animation-duration:5.2s; }
.e1{ animation-duration:3s;animation-delay:-1s; }
.e2{ animation-duration:5s;animation-delay:-2.5s; }
.e3{ animation-duration:4s;animation-delay:-0.5s; }
.c1{ animation-duration:3.2s; }
.c2{ animation-duration:3.4s;}
.c3{ animation-duration:3.5s;}
@keyframes balancar {
    0%{
        transform:translateX(0px) rotate(0deg);
    }
    25%{
        transform:translateX(4px) rotate(1deg);
    }
    50%{
        transform:translateX(0px) rotate(0deg);
    }
    75%{
        transform:translateX(-4px) rotate(-1deg);
    }
    100%{
        transform:translateX(0px) rotate(0deg);
    }
}
@keyframes girar-estrela {
    0%{
        transform:rotate(0deg);
    }
    25%{
        transform:rotate(5deg);
    }
    50%{
        transform:rotate(0deg);
    }
    75%{
        transform:rotate(-5deg);
    }
    100%{
        transform:rotate(0deg);
    }
}
.faixa-nuvens{
    position:absolute;
    top: -10px;
    left: -30px;
    width:100%;
    display:flex;
    justify-content:space-around;
    align-items:flex-end;
    /* z-index:10; */
}
.faixa-nuvens img{
    width:120px;
    height:auto;
}

.faixa-nuvens2{
    position:absolute;
    top: -30px;
    left: -80px;
    width:100%;
    display:flex;
    justify-content:space-around;
    align-items:flex-end;
}
.faixa-nuvens2 img{
    width:120px;
    height:auto;
}
.faixa-nuvens3{
    position:absolute;
    top: -30px;
    left: -100px;
    width:100%;
    display:flex;
    justify-content:space-around;
    align-items:flex-end;
}
.faixa-nuvens3 img{
    width:120px;
    height:auto;
}
/* NUVENS */

.nuvens{
    position:relative;
    padding:30px 25px 165px 25px;
    background-image:
        url('galera.png'),
        url('background.jpg');

    background-repeat:
        no-repeat,
        no-repeat;

    background-position:
        center bottom,
        center center;

    background-size:
        100% auto,
        cover;
}
.faixa-nuvens,
.faixa-nuvens2,
.faixa-nuvens3{
    display:flex;
    gap:30px;
    width:max-content;
}
.faixa-nuvens{
    animation: mover-direita 40s linear infinite;
}
.faixa-nuvens2{
    animation: mover-esquerda 55s linear infinite;
}
.faixa-nuvens3{
    animation: mover-direita 70s linear infinite;
}

@keyframes mover-direita{
    from{
        transform: translateX(-200px);
    }
    to{
        transform: translateX(200px);
    }
}

@keyframes mover-esquerda{
    from{
        transform: translateX(200px);
    }
    to{
        transform: translateX(-200px);
    }
}

/* LOGO */

.logo{
    width:235px;
    /* height:70px; */
    margin:-110px auto 0px;
    border-radius:50px;
    overflow:hidden;
    position:relative;
    z-index:5;
    animation:balancar 15s ease-in-out infinite;
}

.logo img{
    width:100%;
    height:100%;
    object-fit:cover;
}

/* TEXTOS */

.nome-container{
    text-align:center;
}
.linha1{
    font-family:'BravaSlab', serif;
    font-size: 70px;
    font-weight:bold;
    color:#A7DCF8;
    line-height:1;
}
.linha2{
    font-family:'Great Vibes', cursive;
    font-size:50px;
    color:#C8DE85;
    margin-top:-15px;
    position:relative;
    top:-20px;      /* sobe um pouco */
    transform:rotate(-5deg);
    z-index:2;
}
.letra{
    display:inline-block;
    opacity:0;
    transform:translateY(20px);
    animation:aparecer .5s forwards;
}
@keyframes aparecer{
    to{
        opacity:1;
        transform:translateY(0);
    }
}
.subtitulo{
    z-index: 1000;
    text-align:center;
    color:#666;
    font-size:20px;
    margin-bottom:13px;
}

.subtitulo2{
    text-align:center;
    /* color:#666; */
    color: #b1a9a9;
    font-weight: bold;
    font-size:20px;
    margin-bottom:15px;
}



/* DATA */

.data{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:25px;
}

.data-box{
    flex:1;
    text-align:center;
    color:#666;
    font-size: 20px;
    border-top: 1px solid #aaa;border-bottom: 1px solid #aaa;padding-top: 5px;padding-bottom: 5px;
}

.data-box strong{
    /* display:block; */
    /* margin-top:5px; */
    /* font-size:26px; */
    color:#58bfff;
}

.dia{
    text-align:center;
    min-width:120px;
}

.dia .mes{
    color:#777;
    font-weight:600;
}

.dia .numero{
    font-size:72px;
    line-height:1;
    font-weight:700;
    color:#4db8ff;
}

.dia .ano{
    color:#777;
}

/* ÍCONES */

.icones{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
    z-index: 1000;
}

.icone{
    text-align:center;
    z-index: 1000;
}
.icone:hover{
    cursor: pointer;
}

.circulo{
    width:58px;
    height:58px;
    margin:auto;
    border-radius:50%;
    background:#4db8ff;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:24px;
}

.icone p{
    margin-top:8px;
    font-size:11px;
    color:#666;
}
</style>
</head>
<body>

    <div class="nuvens">
        <div class="faixa-nuvens">
            <img src="nuvem.png">
            <img src="nuvem.png">
            <img src="nuvem.png">
            <img src="nuvem.png">
            <img src="nuvem.png">
        </div>
        <div class="faixa-nuvens2">
            <img src="nuvem2.png">
            <img src="nuvem2.png">
            <img src="nuvem2.png">
            <img src="nuvem2.png">
            <img src="nuvem2.png">
        </div>
        <div class="faixa-nuvens3">
            <img src="nuvem.png">
            <img src="nuvem.png">
            <img src="nuvem.png">
            <img src="nuvem.png">
            <img src="nuvem.png">
        </div>
        <img src="dot.png" class="decoracao d1" style="left: 20px;top: 30px;">
        <img src="dot.png" class="decoracao d2" style="left: 355px;top: 40px;">
        <img src="dot.png" class="decoracao d3" style="left: 405px;top: 280px;">
        <img src="dot2.png" class="decoracao d1" style="left: 5px;top: 150px;">
        <img src="dot2.png" class="decoracao d2" style="width: 28px;left: 390px;top: 100px;">
        <img src="dot2.png" class="decoracao d3" style="width: 20px;left: 370px;top: 350px;">
        <img src="dot2.png" class="decoracao d1" style="width: 30px;left: -15px;top: 530px;">
        <img src="dot3.png" class="decoracao d2" style="left: -20px;top: 60px;">
        <img src="dot3.png" class="decoracao d3" style="width: 20px;left: 400px;top: 400px;">
        <img src="dot4.png" class="decoracao d1" style="left: -10px;top: 430px;">
        <img src="dot4.png" class="decoracao d2" style="left: 320px;top: 80px;">
        <img src="dot4.png" class="decoracao d3" style="left: 360px;top: 500px;">

        <img src="clound.png" class="decoracao c1" style="width: 90px;left: -15px;top: -22px">

<script>
function animarTexto(id, delayInicial = 0){
    const elemento = document.getElementById(id);
    const texto = elemento.textContent;

    elemento.innerHTML = '';

    [...texto].forEach((letra, index) => {
        const span = document.createElement('span');
        span.classList.add('letra');
        span.textContent = letra === ' ' ? '\u00A0' : letra;
        span.style.animationDelay =
            `${delayInicial + (index * 0.08)}s`;

        elemento.appendChild(span);
    });
}

animarTexto('nome');
animarTexto('subtitulo', 0.6);
</script>
</body>
</html>
